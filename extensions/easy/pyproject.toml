[project]
name = "redmine-mcp-easy"
version = "1.0.0"
description = "Easy Redmine support for redmine-mcp-server, as an out-of-tree extension"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Andreas Lemmer", email = "andreas.lemmer@mmlab.de"}
]

# `extensions.py` describes itself as provisional and may change the shape
# of ExtensionSpec in a minor release, so this pins a range rather than a
# floor. Raise it deliberately after reading that module's changelog entry.
dependencies = [
    "redmine-mcp-server~=2.17",
]

[project.optional-dependencies]
# Only list_easy_sprints needs this. Easy Redmine serves no sprint endpoint
# -- /easy_sprints.json answers 403 even with a valid key -- so sprint names
# come from the database through REDMINE_EASY_DB_URL. The other eight tools
# go over the REST API and work without it.
mysql = [
    "PyMySQL>=1.1,<2",
]
test = [
    "pytest>=7.0.0,<10",
    "pytest-asyncio>=0.21.0,<2",
    "pytest-mock>=3.10.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redmine_mcp_easy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "slow: starts the server in a subprocess",
]
